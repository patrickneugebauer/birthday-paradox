<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Birthday Paradox</title>
    <style>
        /* 1. Global Page Reset & Dark Theme Background */
        body {
            background-color: #0d1117;
            color: #ffffff; /* Sets all text outside the table to clean white */
            font-family: sans-serif;
            margin: 0;
            padding: 20px; /* Clean buffer padding around your screen contents */
        }

        /* 2. Structured Layout Containers */
        table {
            width: 100%;
            border-collapse: collapse; /* Merges borders into a single crisp line */
            background-color: #0d1117; /* Base dark background for odd rows */
            color: #f3f4f6; /* Off-white readable text inside table cells */
            font-size: 14px;
            margin-top: 15px; /* Adds space beneath your top navigation text links */
        }

        /* 3. Grid Lines & Cell Spacing */
        th, td {
            border: 1px solid #21262d; /* Subtle dark gray grid border lines */
            padding: 10px 14px; /* Internal cell padding */
            text-align: left;
        }

        /* 4. Table Header Configurations */
        th {
            font-weight: bold;
            text-transform: lowercase; /* Matches the lowercase style in your image */
            user-select: none; /* Prevents accidental blue text highlights when clicking */
        }

        /* 5. Seamless Sort Button Architecture */
        th button {
            background: none !important; /* Forces removal of the clunky white boxes */
            border: none !important;     /* Eliminates default button borders */
            color: inherit;              /* Forces sorting icon to match your white text */
            font: inherit;               /* Maintains clean, consistent typography */
            cursor: pointer;
            padding: 0;
            margin-left: 6px;            /* Spaces the button icon away from column text */
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }

        /* Softly highlights the sorting icon when hovered */
        th button:hover {
            color: #58a6ff; /* Changes icon to your theme's signature light blue */
        }

        /* 6. Dynamic Alternating Row Customizations */
        tbody tr:nth-child(even) {
            background-color: #161b22; /* Applies the slightly lighter gray row zebra stripe */
        }

        /* 7. Hyperlink Layout Aesthetics */
        a {
            color: #58a6ff; /* Vibrant light blue interactive link color */
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <script>
        const h = x => document.createElement(x);
        const t = x => document.createTextNode(x);
        function a(link, text) {
            const ele = h('a');
            ele.href = ele;
            ele.text = text;
            ele.target = '_blank';
            return ele;
        }
        const global = {
            fileName: './data.json',
            data: null,
            sort: {
                current: { key: null, dir: null },
                previous : { key: null, dir: null }
            },
            columns: {
                language: x => t(x.language),
                runtime: x => t(x.runtime),
                "data structure": x => t(x.data_structure),
                "execution method": x => t(x.execution_method),
                year: x => x.wiki_url ? a(x.wiki_url, x.year) : t(x.year),
                stars: x => x.github_url ? a(x.github_url, x.stars.toLocaleString()) : null,
                "side (mb)": x => t(x.size_mb.toLocaleString()),
                ips: x => t(x.ips.toLocaleString()),
            },
            tablePointers: {
                thead: null,
                theadCells: {},
                tbody: null,
                tbodyRows: [],
            },
            arrows: {
                updown: '⇅',
                up: '▲',
                down: '▼',
            },
            functions: {}
        };
        window.global = global;
        // initialization
        (function fetchData() {
            //
            Object.assign(global.functions, { getData, handleSort, updateSort, sortData, updateTable, renderTable });
            // externals
            const setData = x => global.data = x;
            // ========================================
            const response = fetch('./data.json');
            const json = response.then(x => x.json());
            json.then(x => {
                setData(x);
                renderTable();
            });

            // functions
            function getData() {
                // externals
                const fileName = global.fileName
                const setData = x => global.data = x;
                // ========================================
                const response = fetch(fileName);
                const json = response.then(x => x.json());
                return json.then(x => {
                    setData(x);
                    renderTable();
                });
            }

            function handleSort() {
                // externals
                const updateSort = global.functions.updateSort;
                const sortData = global.functions.sortData;
                const updateTable = global.functions.updateTable;
                // ==============================
                const start = new Date().getTime();
                const newSortKey = this._headerKey;
                updateSort(newSortKey);
                sortData();
                updateTable();
                console.log(`table sorted in ${new Date().getTime() - start} ms`);
            }

            function updateSort(newSortKey) {
                // externals
                const oldSortKey = global.sort.current.key;
                const oldSortDir = global.sort.current.dir;
                const setSortKey = x => global.sort.current.key = x;
                const setSortDir = x => global.sort.current.dir = x;
                const setPreviousSort = ({ key, dir }) => {
                    global.sort.previous.key = key;
                    global.sort.previous.dir = dir;
                }
                // ==============================
                // calculate new sort
                let newSortDir = null;
                if (oldSortKey !== newSortKey) {
                    newSortDir = 'asc';
                } else {
                    if (oldSortDir === 'asc') {
                        newSortDir = 'desc';
                    } else {
                        newSortDir = 'asc';
                    }
                }
                // update sort
                setPreviousSort({ key: oldSortKey, dir: oldSortDir });
                setSortKey(newSortKey);
                setSortDir(newSortDir);
            }

            function sortData() {
                // externals
                const sortKey = global.sort.current.key;
                const sortDir = global.sort.current.dir;
                const sortable = global.tablePointers.tbodyRows;
                // ========================================
                if (!sortKey) return;
                sortable.sort((a, b) => {
                    const first = a.data[sortKey];
                    const second = b.data[sortKey];
                    if (first === second) {
                        return 0;
                    } else if (!first) {
                        return 1;
                    } else if (!second) {
                        return -1;
                    } else if (first < second) {
                        return (sortDir === 'asc') ? -1 : 1;
                    } else {
                        return (sortDir === 'asc') ? 1 : -1;
                    }
                });
            }

            function updateTable() {
                // externals
                const previousSortKey = global.sort.previous.key;
                const sortKey = global.sort.current.key;
                const sortDir = global.sort.current.dir;
                const tbody = global.tablePointers.tbody;
                const rows = global.tablePointers.tbodyRows;
                const theadCells = global.tablePointers.theadCells;
                const updown = global.arrows.updown;
                const up = global.arrows.up;
                const down = global.arrows.down;
                // =========================
                if (previousSortKey && previousSortKey !== sortKey) {
                    theadCells[previousSortKey].data = `${previousSortKey} ${updown}`;
                }
                const modifier = (sortDir === 'asc') ? up : down;
                theadCells[sortKey].data = `${sortKey} ${modifier}`;
                tbody.replaceChildren(...rows.map(x => x.ele));
            }

            function renderTable() {
                const start = new Date().getTime();
                // externals
                const localData = global.data;
                const setThead = x => global.tablePointers.thead = x;
                const setTbody = x => global.tablePointers.tbody = x;
                const localTheadMap = global.tablePointers.theadCells;
                const localTbodyRows = global.tablePointers.tbodyRows;
                const columnTransforms = global.columnTransforms;
                const skipColumns = global.skipColumns;
                const columns = global.columns;
                // ========================================
                const h = x => document.createElement(x);
                const t = x => document.createTextNode(x);
                const headers = Object.keys(localData[0]);
                const table = h('table');
                // head
                const thead = h('thead');
                setThead(thead);
                const theadRow = h('tr');
                for (const header of Object.keys(columns)) {
                    const cell = h('th');
                    const text = t(`${header} ⇅`);
                    cell._headerKey = header;
                    cell.addEventListener('click', handleSort);
                    localTheadMap[header] = text;
                    cell.append(text);
                    theadRow.append(cell);
                }
                thead.append(theadRow);
                table.append(thead);
                // body
                const tbody = h('tbody');
                setTbody(tbody);
                const columnEntries = Object.entries(columns);
                for (const dataRow of localData) {
                    const trow = h('tr');
                    for (const [name, createNode] of columnEntries) {
                        const cell = h('td');
                        const node = createNode(dataRow);
                        cell.append(node);
                        trow.append(cell);
                    }
                    localTbodyRows.push({ ele: trow, data: dataRow });
                    tbody.append(trow);
                }
                table.append(tbody);
                // append
                document.body.replaceChildren(table);
                console.log(`table rendered in ${new Date().getTime() - start} ms`);
            }

        })()
    </script>
</body>

</html>
